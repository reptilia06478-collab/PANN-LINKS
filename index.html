<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PANN LINKS — Link Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<!-- ═══ TOPBAR ═══ -->
<header class="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    <h1>PANN<span>LINKS</span></h1>
  </div>
  <div class="topbar-actions">
    <button class="tb-btn" id="btn-import" title="Import JSON">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
    </button>
    <button class="tb-btn" id="btn-export" title="Export JSON">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </button>
    <input type="file" id="import-file" accept=".json" hidden>
  </div>
</header>

<!-- ═══ SEARCH + FILTER ═══ -->
<section class="search-section">
  <div class="search-wrap">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="search-input" placeholder="Cari link...">
    <button class="search-clear" id="search-clear">✕</button>
  </div>
  <div class="filter-row" id="filter-row">
    <button class="filter-chip active" data-filter="all">Semua</button>
  </div>
</section>

<!-- ═══ LINK GRID ═══ -->
<main class="main">
  <div class="link-grid" id="link-grid">
    <!-- Rendered by JS -->
  </div>

  <div class="empty-state" id="empty-state">
    <div class="empty-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#3a4a5e"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
    </div>
    <h3>Belum ada link</h3>
    <p>Tap tombol + di kanan bawah untuk tambah link pertama kamu.</p>
  </div>
</main>

<!-- ═══ FAB ═══ -->
<button class="fab" id="fab-add">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
</button>

<!-- ═══ MODAL ADD/EDIT ═══ -->
<div class="modal" id="modal-form">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modal-title">Tambah Link</span>
      <button class="modal-close" id="btn-close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Judul</label>
        <input type="text" id="link-title" placeholder="contoh: TikTok FYP">
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" id="link-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <input type="text" id="link-category" placeholder="contoh: Sosmed" list="category-list">
        <datalist id="category-list"></datalist>
      </div>
      <div class="form-group">
        <label>Catatan (opsional)</label>
        <textarea id="link-note" placeholder="Deskripsi singkat..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" id="btn-cancel-form">Batal</button>
      <button class="btn-primary" id="btn-save-form">Simpan</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL DETAIL ═══ -->
<div class="modal" id="modal-detail">
  <div class="modal-box">
    <div class="modal-head">
      <span>Detail Link</span>
      <button class="modal-close" id="btn-close-detail">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-foot">
      <button class="btn-secondary" id="btn-edit-detail">Edit</button>
      <button class="btn-primary" id="btn-open-detail">Buka</button>
    </div>
  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
  </html>
